name: Build game and launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  EXPORT_PRESET: Shinobi Clash Beta Multiplayer 0.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater and release packaging
        run: python -m unittest discover -s launcher/tests -v

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater on Windows
        run: python -m unittest discover -s launcher/tests -v
      - name: Install Godot and Windows export template
        shell: pwsh
        run: |
          $version = '${{ env.GODOT_VERSION }}'
          $base = "https://github.com/godotengine/godot/releases/download/$version-stable"
          $engine = "Godot_v$version-stable_win64.exe"
          Invoke-WebRequest "$base/$engine.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Invoke-WebRequest "$base/Godot_v$version-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          # Extract only Windows templates rather than expanding every platform.
          $env:TEMPLATE_ZIP = "$env:RUNNER_TEMP/templates.zip"
          $env:TEMPLATE_TARGET = "$env:APPDATA/Godot/export_templates/$version.stable"
          python -c "import os, pathlib, zipfile; z=zipfile.ZipFile(os.environ['TEMPLATE_ZIP']); t=pathlib.Path(os.environ['TEMPLATE_TARGET']); t.mkdir(parents=True, exist_ok=True); [(t / pathlib.PurePosixPath(n).name).write_bytes(z.read(n)) for n in z.namelist() if n.endswith(('windows_release_x86_64.exe', 'windows_debug_x86_64.exe'))]"
          "GODOT=$env:RUNNER_TEMP/godot/$($engine.Replace('.exe', '_console.exe'))" >> $env:GITHUB_ENV
      - name: Import and export game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/game | Out-Null
          & $env:GODOT --headless --editor --path . --import 2>&1 | Tee-Object -FilePath build/import.log
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed.' }
          & $env:GODOT --headless --path . --export-release '${{ env.EXPORT_PRESET }}' build/game/ShinobiClash.exe 2>&1 | Tee-Object -FilePath build/export.log
          if ($LASTEXITCODE -ne 0) { throw 'Godot export failed.' }
          if (Select-String -Path build/import.log,build/export.log -Pattern 'SCRIPT ERROR:|Parse Error:|Failed to load script' -Quiet) {
            throw 'Godot reported script errors. Release blocked; inspect build logs.'
          }
      - name: Build standalone launcher and package game
        shell: pwsh
        run: |
          python -m pip install -r launcher/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Launcher dependencies failed.' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShinobiClashLauncher --distpath release --workpath build/pyinstaller --specpath build launcher/main.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }
          $version = "build-${{ github.run_number }}-${{ github.run_attempt }}"
          python launcher/package_release.py --source build/game --output release --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Game packaging failed.' }
      - name: Verify bundled launcher opens
        shell: pwsh
        run: |
          $app = Start-Process release/ShinobiClashLauncher.exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw 'Launcher exited during startup smoke test.' }
          Stop-Process -Id $app.Id -Force
      - name: Save distributable builds
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-clash-windows
          path: release/*
          if-no-files-found: error
      - name: Save Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-logs
          path: build/*.log

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shinobi-clash-windows
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Draft first: players cannot see a partially uploaded release.
          gh release create "$RELEASE_TAG" release/* --draft --target "$SOURCE_SHA" --title "Shinobi Clash $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
